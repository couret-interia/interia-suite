name: Docs check

on:
  push:
    paths:
      - 'README.md'
      - 'INTERIA_SUITE.md'
      - 'docs/**'
  pull_request:
    paths:
      - 'README.md'
      - 'INTERIA_SUITE.md'
      - 'docs/**'

jobs:
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Placeholder for future markdown / links checks
      - name: Show changed docs files
        run: |
          echo "Docs changed:"
          git diff --name-only HEAD^ HEAD || true
